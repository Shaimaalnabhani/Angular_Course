<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
    <h2>Review Presentation</h2>
    <div class="header">
        <p>You have 3 task(s) to complete</p>

        <button class="add">Add</button>
    </div>

    <div class="task">
     <input type="checkbox" id="t1">
     <label for="t1">Edit Video</label>
     <button class="edit">Edit</button>
     <button class="delete">Delete</button>
    </div>

     <div class="task2">
     <input type="checkbox" id="t2" checked>
     <label for="t2">Buy Eggs & Milk</label>
     <button class="edit">Edit</button>
     <button class="delete">Delete</button>
    </div>

    <div class="task">
     <input type="checkbox" id="t3">
     <label for="t3">Organize Files</label>
     <button class="edit">Edit</button>
     <button class="delete">Delete</button>
    </div>


    <div class="task">
     <input type="checkbox" id="t4">
     <label for="t4">Write Blog Post</label>
     <button class="edit">Edit</button>
     <button class="delete">Delete</button>
    </div>
 </div>
    <div class="right">
        <P>With Free Source Code</P>
        <h1>TO DO LIST</h1>
        <p>HTML, CSS, Javascript</p>
    </div>
    </div>
</body>
</html>
