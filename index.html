<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angular Project</title>
</head>
<body>
    <form>
        <label for="fullname">Full Name:</label>
        <input type= "text" placeholder="Enter Your Name" id="fullname" name="fullname">
        <br>
        <br>
        <label for="email">Email:</label>
        <input type= "email" placeholder="Enter Your email" id="email" name="email">
        <br>
        <br>
        <label for="password">Password:</label>
        <input type= "password" placeholder="Enter Your password" id="password" name="password">
        <br>
        <br>
        <label for="File">File:</label>
        <input type= "file">
        <br>
        <br>
        <label for="age">Age:</label>
        <input type= "number" placeholder="Enter Your Age" id="age" name="age">
        <br>
        <br>
        <label for="DOB">DOB:</label>
        <input type= "date" id="DOB" min="2025-12-01" max="2025-12-31">
        <br>
        <br>
        <label for="gender">Gender:</label>
        <br>
        <br>
        <label for="male">Male:</label>
        <input type= "radio" id="male" name="gender" value="male">
        <br>
        <br>
        <label for="female">Female:</label>
        <input type= "radio" id="male" name="gender" value="female">
        <br>
        <br>
        <label for="skills">Skills:</label>
        <br>
        <br>
        <label for="html">html</label>
        <input type= "checkbox" name="skills" value="html">
        <br>
        <br>
        <label for="java">Java</label>
        <input type= "checkbox" name="skills" value="java">
        <br>
        <br>
        <label for="css">CSS</label>
        <input type= "checkbox" name="skills" value="css">
        <br>
        <br>
        <label for="country">Select country</label>
        <select name="country" id="country">
            <option value="Oman">Oman</option>
            <option value="Bahrain">Bahrain</option>
            <option value="Qatar">Qatar</option>
            <option value="UAE">UAE</option>
            <option value="Kuwite">Kuwite</option>
            <option value="KSA">KSA</option>
        </select>
        <br>
        <br>
        <button>Click</button>

    </form>
    
</body>
</html>
